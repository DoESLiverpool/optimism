services:
  db:
    image: postgres
    container_name: optimism_db
    environment:
      POSTGRES_PASSWORD: topsecret
    volumes:
      - ./databases/optimism_production:/var/lib/postgresql/data
    restart: always
  api:
    build:
      context: api/
      args:
        OPTIMISM_API_CLIENT_SIDE_URL: "http://localhost:3001/api"
        OPTIMISM_WEBSITE_BASE_URL: "http://localhost:3000"
        OPTIMISM_EMAIL_ORG_FROM_ADDR: "bookings@example.com"
        OPTIMISM_EMAIL_ORG_NOTIFY_ADDR: "organisers@example.com"
        OPTIMISM_SMTP_HOST: "smtp.example.com"
        OPTIMISM_SMTP_PORT: "587"
        OPTIMISM_SMTP_SECURE: "false"
    container_name: optimism_api
    ports:
      - 127.0.0.1:3001:3001
    links:
      - db
    secrets:
      - email_user
      - email_pass
    restart: always
  website:
    build:
      context: website/
      args:
        OPTIMISM_API_CLIENT_SIDE_URL: "http://localhost:3001/api"
    container_name: optimism_website
    ports:
      - 127.0.0.1:3000:3000
    links:
      - api
    restart: always
secrets:
  email_user:
    file: email_user
  email_pass:
    file: email_pass

